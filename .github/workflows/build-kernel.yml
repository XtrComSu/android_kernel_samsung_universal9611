name: Build Kernel (KSUN + SUSFS)

# Builds the XT-Xenos9611 kernel (KernelSU-Next legacy-susfs-v2 + SUSFS v2.3.0)
# with full LLVM binutils, then packages it with AnyKernel3.
#
# Run manually from the Actions tab, or push to the integration branch.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Device target"
        required: true
        default: "m31"
        type: choice
        options:
          - m31
          - a51
          - f41
          - m31s
          - m21
          - gta4xl
          - gta4xlwifi
      toolchain_url:
        description: "Clang toolchain tarball URL (must contain bin/clang)"
        required: false
        default: "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
  push:
    branches:
      - ksun-susfs

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      # Defaults for push-triggered runs (workflow_dispatch inputs win).
      TARGET: ${{ github.event.inputs.target || 'm31' }}
      TOOLCHAIN_URL: ${{ github.event.inputs.toolchain_url || 'https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential zstd xz-utils zip unzip wget cpio rsync \
            python3 python3-pip

      - name: Fetch and prepare clang toolchain
        run: |
          set -euo pipefail
          echo "Toolchain: $TOOLCHAIN_URL"
          mkdir -p toolchain /tmp/ts_extract
          wget -q --show-progress -O /tmp/ts.tar "$TOOLCHAIN_URL"
          # Support .tar.gz/.tgz/.tar.xz/.tar.zst transparently.
          tar --use-compress-program='zstd -d' -xf /tmp/ts.tar -C /tmp/ts_extract 2>/dev/null \
            || tar -xf /tmp/ts.tar -C /tmp/ts_extract
          # clang is usually a symlink (clang -> clang-16), so match files OR symlinks.
          CLANG_BIN="$(find /tmp/ts_extract \( -type f -o -type l \) -path '*/bin/clang' | head -1)"
          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: no bin/clang found in toolchain archive"; find /tmp/ts_extract -maxdepth 3 -type d; exit 1
          fi
          CLANG_ROOT="$(dirname "$(dirname "$CLANG_BIN")")"
          cp -a "$CLANG_ROOT"/. toolchain/
          test -x toolchain/bin/clang
          ./toolchain/bin/clang --version
          ls toolchain/bin | grep -E '^(ld\.lld|llvm-(as|ar|nm|objdump|readelf|objcopy))$' || true

      - name: Verify integration inputs
        run: |
          set -euo pipefail
          test -f drivers/kernelsu/Kbuild
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f arch/arm64/configs/exynos9611-${TARGET}_defconfig
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c
          grep -m1 'SUSFS_VERSION' include/linux/susfs.h

      - name: Build kernel + package (AnyKernel3)
        env:
          # drivers/kernelsu is vendored without .git, so the Kbuild would
          # otherwise report KSU_VERSION=1. Pin the real git-derived value for
          # the pinned revision (tag v3.3.0-legacy-susfs-v2 @ 36679224, 3014
          # commits): 30000 + 3014 + 200 = 33214, matching the KernelSU-Next
          # v3.3.0 manager (UAPI 2).
          KSU_VERSION_OVERRIDE: "33214"
          KSU_VERSION_TAG_OVERRIDE: "v3.3.0-legacy-susfs-v2"
          # Keep the runner's user/host out of /proc/version (stealth).
          KBUILD_BUILD_USER: "builder"
          KBUILD_BUILD_HOST: "localhost"
        run: |
          set -euo pipefail
          python3 build_kernel.py --target "${TARGET}" --allow-dirty

      - name: Post-build verification
        run: |
          set -euo pipefail
          echo "===== effective config ====="
          grep -E "CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_SUS_MOUNT=" out/.config || true
          echo "===== external wifi / nethunter (must all be =y) ====="
          for s in CONFIG_MAC80211 CONFIG_CFG80211 CONFIG_RTL8XXXU CONFIG_MT7601U \
                   CONFIG_ATH9K_HTC CONFIG_RT2X00 CONFIG_RT2800USB CONFIG_RTL8192CU \
                   CONFIG_ATH10K CONFIG_ATH10K_USB CONFIG_USB_CONFIGFS_F_HID; do
            grep -q "^${s}=y" out/.config || { echo "MISSING: $s"; exit 1; }
          done
          grep -E "^CONFIG_(LOCALVERSION|MAC80211|RTL8XXXU|MT7601U|ATH9K_HTC|RT2800USB|RTL8192CU|ATH10K_USB|USB_CONFIGFS_F_HID)=" out/.config
          echo "===== tuning / stealth / nethunter extras (must all be =y) ====="
          for s in CONFIG_IOSCHED_BFQ CONFIG_KPROBES CONFIG_SECURITY_DMESG_RESTRICT \
                   CONFIG_USB_SERIAL_OPTION CONFIG_USB_NET_RNDIS_HOST \
                   CONFIG_USB_CONFIGFS_MASS_STORAGE CONFIG_USB_CONFIGFS_F_UAC1 \
                   CONFIG_USB_CONFIGFS_F_UAC2 CONFIG_INPUT_JOYDEV; do
            grep -q "^${s}=y" out/.config || { echo "MISSING: $s"; exit 1; }
          done
          grep -E '^CONFIG_DEFAULT_IOSCHED="' out/.config
          echo "===== tcp congestion default (must stay bic) ====="
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bic"' out/.config || { echo "MISSING: DEFAULT_TCP_CONG=bic"; exit 1; }
          grep -q '^CONFIG_DEFAULT_BIC=y' out/.config || { echo "MISSING: DEFAULT_BIC=y"; exit 1; }
          grep -E '^CONFIG_(DEFAULT_TCP_CONG|DEFAULT_BIC|TCP_CONG_BBR)' out/.config
          echo "===== Image ====="
          ls -lh out/arch/arm64/boot/Image
          echo "===== embedded markers ====="
          strings out/arch/arm64/boot/Image | grep -m1 -i "susfs" || echo " (no susfs string in Image - symbol hiding active)"
          strings out/arch/arm64/boot/Image | grep -m1 -i "KernelSU" || true
          echo "===== KSU version tag (must be v3.3.0-legacy-susfs-v2) ====="
          strings out/arch/arm64/boot/Image | grep -m1 "v3.3.0-legacy-susfs-v2" || echo " (tag NOT found!)"
          echo "===== external module: r8188eu.ko (RTL8188EU/EUS USB wifi) ====="
          grep -q "^CONFIG_R8188EU=m" out/.config || { echo "MISSING: CONFIG_R8188EU=m"; exit 1; }
          KO="$(find out -name r8188eu.ko | head -1)"
          [ -n "$KO" ] || { echo "ERROR: r8188eu.ko was not built"; exit 1; }
          mkdir -p kmods
          cp "$KO" kmods/
          ls -lh kmods/r8188eu.ko
          echo "===== artifacts ====="
          ls -lh *.zip

      - name: Upload kernel package
        uses: actions/upload-artifact@v4
        with:
          name: ksun-susfs-${{ github.event.inputs.target || 'm31' }}
          path: |
            *.zip
            kmods/*.ko
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/exynos9611.dtb
            out/arch/arm64/boot/dtbo-*.img
          if-no-files-found: error
